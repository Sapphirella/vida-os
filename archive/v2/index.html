<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#eaf0f7">
  <meta name="description" content="VidaOS —— 你的私密生活记录空间。液态玻璃风格，纯本地离线运行。">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="VidaOS">
  <title>VidaOS · 记录生活的点滴</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <link rel="icon" type="image/svg+xml" href="assets/icon.svg">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- 背景层（极浅渐变 + 柔和光斑，供磨砂玻璃模糊）-->
  <div class="bg"></div>
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="blob blob-3"></div>

  <div class="app">
    <!-- 顶部导航栏：显示当前界面 -->
    <header class="topbar">
      <div class="topbar-inner">
        <button class="topbar-back" id="topBack" aria-label="返回"></button>
        <div class="topbar-title-wrap">
          <h1 class="topbar-title" id="topTitle">VidaOS</h1>
          <span class="topbar-sub" id="topSub"></span>
        </div>
        <div class="topbar-spacer"></div>
        <div class="topbar-clock" id="topClock">--:--</div>
      </div>
    </header>

    <!-- 主内容：各视图由 app.js 渲染 -->
    <main class="content" id="content">
      <section class="view active" id="view-desk"></section>
      <section class="view" id="view-notes"></section>
      <section class="view" id="view-data"></section>
      <section class="view" id="view-settings"></section>

      <section class="view" id="view-space"></section>
      <section class="view" id="view-collection"></section>
      <section class="view" id="view-article"></section>
      <section class="view" id="view-moments"></section>
      <section class="view" id="view-mailbox"></section>
      <section class="view" id="view-favorites"></section>
    </main>

    <!-- 底部 Tab 导航（桌面 / 便签 / 数据 / 设置）-->
    <nav class="tabbar" id="tabbar">
      <div class="tabbar-inner" id="tabbarInner"></div>
    </nav>
  </div>

  <!-- 全屏沉浸式编辑器 -->
  <div class="editor" id="editor">
    <div class="editor-top">
      <button class="icon-glass" id="edClose" aria-label="返回"></button>
      <input class="editor-title-input" id="edTitle" placeholder="标题…" autocomplete="off">
      <button class="icon-glass" id="edFavorite" aria-label="收藏"></button>
      <button class="glass-btn btn-primary" id="edSave">保存</button>
    </div>
    <div class="ed-meta" id="edMeta"></div>
    <div class="md-toolbar" id="mdToolbar"></div>
    <div class="editor-body">
      <textarea class="md-textarea" id="edText" spellcheck="false" placeholder="开始书写…"></textarea>
      <div class="md-preview" id="edPreview"></div>
    </div>
    <div class="editor-images" id="edImages"></div>
    <div class="editor-foot">
      <span class="wc" id="edWc"></span>
      <button class="glass-btn" id="edImageBtn"></button>
      <button class="glass-btn" id="edModeBtn">预览</button>
    </div>
  </div>

  <!-- 模态弹窗层 -->
  <div class="modal-layer" id="modalLayer"></div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 隐藏文件输入 -->
  <input type="file" id="imageInput" accept="image/*" multiple hidden>
  <input type="file" id="singleImageInput" accept="image/*" hidden>
  <input type="file" id="audioInput" accept="audio/*" hidden>
  <input type="file" id="importInput" accept=".json,.md,.markdown,.txt,application/json,text/markdown,text/plain" hidden>

  <!-- 打印 iframe（用于导出 PDF）-->
  <iframe id="printFrame" title="print" style="display:none"></iframe>

  <script src="js/vendor/marked.min.js"></script>
  <script src="js/vendor/purify.min.js"></script>
  <script src="js/icons.js"></script>
  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
