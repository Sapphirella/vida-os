<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#f5f7fa">
    <title>VidaOS - 记录生活的点滴</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.8/purify.min.js"></script>
</head>
<body>
    <!-- 状态栏 -->
    <div class="status-bar" id="statusBar">
        <div class="status-time" id="statusTime">10:41</div>
        <div class="status-right">
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 109 20h9a5 5 0 000-10z"/></svg>
            <svg class="status-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><path d="M6 7v10M18 7v10"/></svg>
            <span class="battery-level">77</span>
        </div>
    </div>

    <!-- 顶部导航 -->
    <header class="app-header" id="appHeader">
        <button class="header-btn menu-btn" id="menuBtn" aria-label="菜单">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>
        <h1 class="header-title" id="headerTitle">VidaOS</h1>
        <button class="header-btn water-drop-btn" id="waterDropBtn" aria-label="水滴">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2.69l5.66 5.66a8 8 0 1 1-11.31 0z"/></svg>
        </button>
    </header>

    <!-- 侧边菜单 -->
    <div class="side-menu-overlay" id="sideMenuOverlay"></div>
    <nav class="side-menu" id="sideMenu">
        <div class="side-menu-header">
            <div class="avatar-glass">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </div>
            <h3 class="side-menu-name">VidaOS</h3>
            <p class="side-menu-subtitle">记录生活的每一刻</p>
        </div>
        <div class="side-menu-items">
            <button class="side-menu-item active" data-view="home">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
                <span>主页</span>
            </button>
            <button class="side-menu-item" data-view="timeline">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                <span>时间线</span>
            </button>
            <button class="side-menu-item" data-view="tags">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                <span>标签</span>
            </button>
            <button class="side-menu-item" data-view="gallery">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                <span>图集</span>
            </button>
            <button class="side-menu-item" data-view="settings">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                <span>设置</span>
            </button>
        </div>
        <div class="side-menu-footer">
            <p>VidaOS v1.0</p>
        </div>
    </nav>

    <!-- 主内容区 -->
    <main class="main-content" id="mainContent">
        <!-- 主页视图 -->
        <section class="view active" id="homeView">
            <!-- 日期时间卡片 -->
            <div class="glass-card hero-card">
                <div class="hero-date" id="heroDate">September 7, 2026 / Monday</div>
                <div class="hero-time" id="heroTime">10:41</div>
            </div>

            <!-- 快捷操作 -->
            <div class="quick-actions">
                <button class="action-btn glass-btn" id="newPostBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    <span>写日记</span>
                </button>
                <button class="action-btn glass-btn" id="newPhotoBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <span>发照片</span>
                </button>
                <button class="action-btn glass-btn" id="newRantBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/></svg>
                    <span>吐槽</span>
                </button>
                <button class="action-btn glass-btn" id="importBtn">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <span>导入</span>
                </button>
            </div>

            <!-- 统计概览 -->
            <div class="stats-bar">
                <div class="stat-item">
                    <span class="stat-number" id="totalPosts">0</span>
                    <span class="stat-label">文章</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalPhotos">0</span>
                    <span class="stat-label">照片</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalTags">0</span>
                    <span class="stat-label">标签</span>
                </div>
                <div class="stat-item">
                    <span class="stat-number" id="totalDays">0</span>
                    <span class="stat-label">记录天数</span>
                </div>
            </div>

            <!-- 最近文章 -->
            <div class="section-header">
                <h2 class="section-title">最近记录</h2>
                <button class="view-all-btn" id="viewAllPosts">查看全部</button>
            </div>
            <div class="posts-list" id="postsList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                    <p>还没有记录哦</p>
                    <p class="empty-sub">点击下方按钮开始你的第一篇日记</p>
                </div>
            </div>
        </section>

        <!-- 时间线视图 -->
        <section class="view" id="timelineView">
            <div class="view-header">
                <h2 class="view-title">时间线</h2>
            </div>
            <div class="timeline" id="timeline">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
                    <p>时间线为空</p>
                </div>
            </div>
        </section>

        <!-- 标签视图 -->
        <section class="view" id="tagsView">
            <div class="view-header">
                <h2 class="view-title">标签</h2>
            </div>
            <div class="tags-cloud" id="tagsCloud">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
                    <p>还没有标签</p>
                </div>
            </div>
        </section>

        <!-- 图集视图 -->
        <section class="view" id="galleryView">
            <div class="view-header">
                <h2 class="view-title">图集</h2>
            </div>
            <div class="gallery-grid" id="galleryGrid">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                    <p>还没有照片</p>
                </div>
            </div>
        </section>

        <!-- 设置视图 -->
        <section class="view" id="settingsView">
            <div class="view-header">
                <h2 class="view-title">设置</h2>
            </div>
            <div class="settings-list">
                <div class="settings-group">
                    <h3 class="settings-group-title">数据管理</h3>
                    <button class="settings-item" id="exportJSONBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">导出 JSON</span>
                            <span class="settings-item-desc">导出全部数据为 JSON 文件</span>
                        </div>
                    </button>
                    <button class="settings-item" id="exportTXTBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">导出 TXT</span>
                            <span class="settings-item-desc">导出为纯文本合集</span>
                        </div>
                    </button>
                    <button class="settings-item" id="exportMDBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">导出 Markdown</span>
                            <span class="settings-item-desc">导出全部文章为 Markdown</span>
                        </div>
                    </button>
                    <button class="settings-item" id="exportPDFBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">导出 PDF</span>
                            <span class="settings-item-desc">生成 PDF 文档</span>
                        </div>
                    </button>
                    <button class="settings-item" id="importDataBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">导入数据</span>
                            <span class="settings-item-desc">从 JSON/TXT/Markdown 导入</span>
                        </div>
                    </button>
                    <button class="settings-item danger" id="clearDataBtn">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">清空所有数据</span>
                            <span class="settings-item-desc">此操作不可恢复</span>
                        </div>
                    </button>
                </div>
                <div class="settings-group">
                    <h3 class="settings-group-title">关于</h3>
                    <div class="settings-item static">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>
                        <div class="settings-item-content">
                            <span class="settings-item-title">版本</span>
                            <span class="settings-item-desc">VidaOS v1.0</span>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- 底部导航 -->
    <nav class="bottom-nav" id="bottomNav">
        <button class="nav-item active" data-view="home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/></svg>
            <span>Desk</span>
        </button>
        <button class="nav-item" data-view="timeline">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
            <span>Space</span>
        </button>
        <button class="nav-item" data-view="tags">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41l-7.17 7.17a2 2 0 01-2.83 0L2 12V2h10l8.59 8.59a2 2 0 010 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
            <span>Friends</span>
        </button>
        <button class="nav-item" data-view="settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
            <span>设置</span>
        </button>
    </nav>

    <!-- 编辑弹窗 -->
    <div class="modal-overlay" id="editModal">
        <div class="modal glass-modal">
            <div class="modal-header">
                <h3 id="modalTitle">写日记</h3>
                <button class="modal-close" id="modalClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="text" class="glass-input" id="postTitle" placeholder="标题（可选）">
                <div class="editor-toolbar">
                    <button class="toolbar-btn active" data-mode="write">编辑</button>
                    <button class="toolbar-btn" data-mode="preview">预览</button>
                </div>
                <textarea class="glass-textarea" id="postContent" placeholder="今天发生了什么有趣的事？写下来吧..." rows="10"></textarea>
                <div class="markdown-preview" id="markdownPreview"></div>
                <div class="image-upload-area" id="imageUploadArea">
                    <input type="file" id="imageInput" accept="image/*" multiple hidden>
                    <div class="upload-placeholder">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
                        <span>点击添加照片</span>
                    </div>
                </div>
                <div class="image-preview-grid" id="imagePreviewGrid"></div>
                <div class="tag-input-area">
                    <input type="text" class="glass-input tag-input" id="tagInput" placeholder="添加标签，用空格分隔">
                    <div class="tags-preview" id="tagsPreview"></div>
                </div>
                <div class="post-type-selector">
                    <label class="type-option">
                        <input type="radio" name="postType" value="diary" checked>
                        <span class="type-label">日记</span>
                    </label>
                    <label class="type-option">
                        <input type="radio" name="postType" value="photo">
                        <span class="type-label">照片</span>
                    </label>
                    <label class="type-option">
                        <input type="radio" name="postType" value="rant">
                        <span class="type-label">吐槽</span>
                    </label>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="cancelBtn">取消</button>
                <button class="btn-primary" id="saveBtn">保存</button>
            </div>
        </div>
    </div>

    <!-- 文章详情弹窗 -->
    <div class="modal-overlay" id="detailModal">
        <div class="modal glass-modal detail-modal">
            <div class="modal-header">
                <h3 id="detailTitle">文章详情</h3>
                <div class="modal-actions">
                    <button class="icon-btn" id="editPostBtn" title="编辑">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                    </button>
                    <button class="icon-btn" id="deletePostBtn" title="删除">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"/></svg>
                    </button>
                    <button class="modal-close" id="detailClose">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                    </button>
                </div>
            </div>
            <div class="modal-body detail-body" id="detailBody"></div>
        </div>
    </div>

    <!-- 导入弹窗 -->
    <div class="modal-overlay" id="importModal">
        <div class="modal glass-modal">
            <div class="modal-header">
                <h3>导入数据</h3>
                <button class="modal-close" id="importClose">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="modal-body">
                <input type="file" id="importFileInput" accept=".json,.txt,.md,.markdown" hidden>
                <div class="import-drop-zone" id="importDropZone">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    <p>点击选择文件或拖拽到此处</p>
                    <p class="import-formats">支持 JSON、TXT、Markdown</p>
                </div>
            </div>
        </div>
    </div>

    <!-- 确认弹窗 -->
    <div class="modal-overlay" id="confirmModal">
        <div class="modal glass-modal confirm-modal">
            <div class="modal-body text-center">
                <svg class="confirm-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <h3 id="confirmTitle">确认操作</h3>
                <p id="confirmMessage">确定要执行此操作吗？</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="confirmCancel">取消</button>
                <button class="btn-danger" id="confirmOk">确定</button>
            </div>
        </div>
    </div>

    <!-- Toast 提示 -->
    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
</body>
</html>
